<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <defs>
    <radialGradient id="infoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="infoRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="44" fill="url(#infoGlow)">
    <animate attributeName="r" values="30;44;30" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="50" cy="50" r="28" fill="rgba(11, 19, 32, 0.85)" stroke="url(#infoRing)" stroke-width="3"/>

  <!-- Info "i" Symbol -->
  <circle cx="50" cy="38" r="4" fill="#FFFFFF"/>
  <rect x="46" y="46" width="8" height="20" rx="4" fill="#FFFFFF"/>
</svg>
