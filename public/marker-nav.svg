<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>

  <!-- Pulse Outer Glow Ring -->
  <circle cx="50" cy="50" r="44" fill="url(#glow)">
    <animate attributeName="r" values="32;46;32" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass Backdrop Circle -->
  <circle cx="50" cy="50" r="28" fill="rgba(11, 19, 32, 0.85)" stroke="url(#ringGrad)" stroke-width="3"/>

  <!-- Directional Chevron Arrow -->
  <path d="M50 32 L64 54 L56 54 L56 68 L44 68 L44 54 L36 54 Z" fill="url(#ringGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
